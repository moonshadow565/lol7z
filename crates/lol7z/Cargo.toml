[package]
name = "lol7z"
version = "0.1.0"
description = "7-Zip plugin DLL for League of Legends formats: WAD, modpkg and wxy"
license = "MIT"
edition.workspace = true

[lib]
crate-type = ["cdylib"]

[lints]
workspace = true

[dependencies]
lol7z_api = { path = "../lol7z-api" }
lol7z_wad = { path = "../lol7z-wad" }
lol7z_modpkg = { path = "../lol7z-modpkg" }
lol7z_wxy = { path = "../lol7z-wxy" }
