[workspace]
resolver = "3"

members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "MIT"

[profile.bench]
debug = true

[workspace.dependencies]
windows-core = "0.62"
windows = { 
    version = "0.62", 
    features = [
        "Win32_Foundation",                    # HRESULT constants, FILETIME, SysAllocStringByteLen
        "Win32_System_Com",                    # STREAM_SEEK_*
        "Win32_System_Com_StructuredStorage",  # PROPVARIANT + From impls
        "Win32_System_Variant",                # VT_* constants
    ]
}
bitflags = "2.5.0"
open-enum = "0.5.3"  # until `_ = ..` open enums are stable (rust-lang/rust#156628)
# TODO: comonly used stuff, trim as we go...
byteorder = "1.5.0"
thiserror = "1.0.60"
miette = "7.2.0"
xxhash-rust = { version = "0.8.15", features = ["xxh64", "xxh3"] }
flate2 = "1.0.30"
zstd = { version = "0.13", default-features = false }
indexmap = { version = "2.7.0", features = ["serde"] }
scroll = "0.13"
serde = { version = "1.0", features = ["derive"] }
rmp-serde = "1.3"
serde_json = { version = "1.0", features = ["preserve_order"] }
ltk_mimir_cache = "0.1.0"
ltk_hashdb = "0.1.0"

[workspace.lints.rust]
warnings = "warn"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious  = { level = "deny", priority = -1 }
perf        = { level = "warn", priority = -1 }
style       = { level = "warn", priority = -1 }
complexity  = { level = "warn", priority = -1 }
pedantic    = { level = "allow", priority = -1 }
